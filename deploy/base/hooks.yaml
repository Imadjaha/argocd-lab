# Argo CD hooks: run at specific phases of a sync, then get cleaned up.
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - {name: check, image: busybox:1.36, command: ["sh","-c","echo 'PreSync: pretend DB migration runs here'; sleep 3"]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postsync-notify
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - {name: notify, image: busybox:1.36, command: ["sh","-c","echo 'PostSync: pretend Slack notification sent'"]}
