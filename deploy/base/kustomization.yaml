apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [app.yaml, hooks.yaml]
configMapGenerator:
  - name: web-html
    files: [web/index.html]
  - name: web-conf
    files: [web/default.conf]
  - name: api-code
    files: [api/server.js]
  - name: app-config
    literals: [APP_VERSION=v1, APP_ENV=base]
