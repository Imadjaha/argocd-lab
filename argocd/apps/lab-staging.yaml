apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-staging
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: lab
  source:
    repoURL: https://github.com/imadjaha/argocd-lab.git
    targetRevision: main
    path: deploy/overlays/staging
  destination: {server: https://kubernetes.default.svc, namespace: lab-staging}
  syncPolicy:
    automated: {prune: true}                   # auto-sync, but manual kubectl edits are NOT reverted
    syncOptions: [CreateNamespace=true]
