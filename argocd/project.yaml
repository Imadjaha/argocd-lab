apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: lab, namespace: argocd}
spec:
  description: Guardrails for the lab apps
  sourceRepos: ["https://github.com/imadjaha/argocd-lab.git"]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "lab-*"}
    - {server: https://kubernetes.default.svc, namespace: "set-*"}
  clusterResourceWhitelist: [{group: "", kind: Namespace}]
